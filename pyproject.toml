[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidolon-memory"
version = "0.1.0"
description = "Eidolon semantic memory — MCP, NATS writes, JetStream"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "eidolon-memory-contracts",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "litellm>=1.0",
    "mempalace==3.6.0",
    "python-dotenv>=1.0",
    "nats-py>=2.9",
    "mcp>=1.2.0",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    # FastAPI powers the supervisor's admin HTTP control surface. Light
    # transitive surface (starlette + pydantic, both already pulled in).
    "fastapi>=0.110",
]

[project.optional-dependencies]
# Wiring for deployments embedded in Eidolon OS: the reverse memory-engine port
# and the turn-absorption audit log. The service runs without it — see
# eidolon/memory/integrations/.
eidolon-os = ["eidolon-data"]
# Milvus client, for mempalace.backend = milvus.
milvus = ["mempalace[milvus]==3.6.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.4", "eidolon-data"]

[tool.uv]
# Offering the milvus extra makes the resolver pick a protobuf that satisfies
# pymilvus (>= 7) for every install, including ones without that extra. Chroma
# reaches OpenTelemetry's OTLP exporter transitively, and the resolver would
# otherwise settle on a 2022-era version whose generated protobuf code cannot
# load under protobuf 7 — it imports, then raises "Descriptors cannot be created
# directly" on first use. Constraining the floor keeps both backends installable
# in one environment; it adds no dependency of its own.
constraint-dependencies = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.44",
    "opentelemetry-proto>=1.44",
]

[tool.uv.sources]
# The wire contracts ship as their own distribution so that a client which only
# speaks the protocol does not have to install this service's storage stack.
eidolon-memory-contracts = { path = "./contracts", editable = true }
eidolon-data = { path = "../eidolon_data", editable = true }

[project.scripts]
eidolon-memory-agent = "eidolon.memory.entrypoints.agent_runner:main"
eidolon-memory-supervisor = "eidolon.memory.entrypoints.supervisor:main"
eidolon-memory-discovery = "eidolon.memory.entrypoints.discovery_server:main"
eidolon-memory-consolidator = "eidolon.memory.entrypoints.consolidator:main"

[tool.hatch.build.targets.wheel]
packages = ["eidolon"]
include = [
    "eidolon/memory/config/prompts/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"eidolon/memory/**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "mempalace: needs real MemPalace Python package",
    "e2e: needs nats-server + eidolon-memory-agent subprocess",
    "llm: needs EIDOLON_MEMORY_LLM_API_KEY env var (real LLM endpoint)",
    "live_realm: destructive/operational test against explicitly configured real Realm services",
]
