[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidolon-memory"
version = "0.1.0"
description = "Eidolon semantic memory — MCP, NATS writes, JetStream"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "eidolon-memory-contracts",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "litellm>=1.0",
    "mempalace==3.6.0",
    "python-dotenv>=1.0",
    "nats-py>=2.9",
    "mcp>=1.2.0",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    # Metrics exposition. In the base requirements rather than an extra because a
    # service you cannot observe is not one you can operate — and the library is
    # pure Python with no dependencies of its own.
    "prometheus-client>=0.20",
    # FastAPI powers the supervisor's admin HTTP control surface. Light
    # transitive surface (starlette + pydantic, both already pulled in).
    "fastapi>=0.110",
]

[project.optional-dependencies]
# There is no ``eidolon-os`` extra. ``eidolon/memory/integrations/eidolon_data/``
# held the wiring it named and was deleted on 2026-08-07: both adapters were
# written against eidolon_data v1, which ``refactor: complete system data v2
# boundary`` replaced, and neither was reachable from any production path. The
# turn-absorption audit hook survives in ``turn_processor`` — see ``audit_sink``.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    # Validates benchmark manifests against the published schema, so a
    # provenance field cannot be quietly dropped or misspelled.
    "jsonschema>=4.20",
]

[tool.uv.sources]
# The wire contracts ship as their own distribution so that a client which only
# speaks the protocol does not have to install this service's storage stack.
eidolon-memory-contracts = { path = "./contracts", editable = true }

[project.scripts]
eidolon-memory-agent = "eidolon.memory.entrypoints.agent_runner:main"
eidolon-memory-supervisor = "eidolon.memory.entrypoints.supervisor:main"
eidolon-memory-discovery = "eidolon.memory.entrypoints.discovery_server:main"
eidolon-memory-embedder = "eidolon.memory.entrypoints.embedding_server:main"
eidolon-memory-consolidator = "eidolon.memory.entrypoints.consolidator:main"

[tool.hatch.build.targets.wheel]
packages = ["eidolon"]
include = [
    "eidolon/memory/config/prompts/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"eidolon/memory/**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The llm mark is a gate, and this is what makes it one. Those tests declared
# themselves gated in their own docstrings ("run via -m e2e") and were run by
# every default invocation anyway, because nothing here honoured it.
#
# What they measure is not this repository. They send forty turns through a
# real LLM endpoint and wait for the steward to drain them, so their verdict
# is that service's throughput on the day — and a full run came back red
# whenever it was slow. A suite that is red for reasons outside the code is
# not a regression signal, and the cost of that is not the two failures, it is
# that nobody can use the other 1108 results.
#
# Deselected, not deleted: `pytest -m llm` runs them, and a command-line -m
# overrides this one. Deselection is also counted in the summary, so what did
# not run stays visible rather than quietly absent.
addopts = "-m 'not llm'"
markers = [
    "mempalace: needs real MemPalace Python package",
    "e2e: needs nats-server + eidolon-memory-agent subprocess",
    "llm: needs EIDOLON_MEMORY_LLM_API_KEY env var (real LLM endpoint)",
    "live_realm: destructive/operational test against explicitly configured real Realm services",
]
