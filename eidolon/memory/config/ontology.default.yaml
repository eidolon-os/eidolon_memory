# Default ontology + MCP tool name mapping (override path via EIDOLON_MEMORY_ONTOLOGY_YAML).
wings:
  - id: Wing_Relationship
    display_name: "亲密关系与家人"
    description: "伴侣、家人、好友与情感羁绊相关记忆。"
    sort_order: 1
  - id: Wing_Career
    display_name: "工作与学业"
    description: "职业压力、项目、学业与成就相关记忆。"
    sort_order: 2
  - id: Wing_Life
    display_name: "生活方式与兴趣"
    description: "爱好、宠物、日常琐事与消费偏好。"
    sort_order: 3
  - id: Wing_Health
    display_name: "身心健康"
    description: "身体状态、睡眠、运动与情绪底色。"
    sort_order: 4

mcp_tools:
  search_drawers: "search_drawers"
  add_to_drawer: "add_to_drawer"
  check_or_create_room: "check_or_create_room"
  search_existing_rooms: "search_existing_rooms"
  archive_room: "archive_room"
  set_room_status: "set_room_status"
  delete_document: ""

recall:
  top_k: 5
  timeout_seconds: 0.12
  recency_weight: 0.35
  filter_taboo_statuses: ["taboo", "archived"]

steward:
  prompt_template_path: ""  # empty = packaged default resolved at runtime

filters:
  ignore_smalltalk_regex: ""
