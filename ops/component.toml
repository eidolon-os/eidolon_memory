# How Memory is operated, stated by Memory.
#
# Memory is the component with the largest gap between what a release contains
# and what a Host needs: its encoder is model weights, and weights are not in
# git. That gap is declared under [[artifacts]] rather than left for an
# operator to discover on a board with no network.
#
# The schema is eidolon_ops's contracts/component-ops/v1.schema.json;
# tests/test_operations_contract.py checks these claims against this
# repository's own configuration.

schema_version = 1
component_id = "eidolon_memory"
contract_version = "1"

[[units]]
id = "eidolon-memory-embedder"
kind = "service"
exec = ".venv/bin/eidolon-memory-embedder"
user = "eidolon"
serves = ["memory_embedder"]
requires = []
after = ["local-fs.target"]

[[units]]
id = "eidolon-memory-supervisor"
kind = "service"
exec = ".venv/bin/eidolon-memory-supervisor"
user = "eidolon"
serves = ["memory_admin"]
requires = ["eidolon-nats", "eidolon-admin", "eidolon-memory-embedder"]
after = ["local-fs.target"]

[[units]]
id = "eidolon-memory-discovery"
kind = "service"
exec = ".venv/bin/eidolon-memory-discovery"
user = "eidolon"
serves = ["memory_discovery"]
requires = ["eidolon-memory-supervisor"]
after = ["local-fs.target"]

[ports.memory_admin]
default = 8019
bind = "loopback"
purpose = "supervisor administration"

[ports.memory_discovery]
default = 8020
bind = "loopback"
purpose = "where the palace for a memory space is, asked by Agent"

[ports.memory_embedder]
default = 8760
bind = "loopback"
purpose = "shared BGE-small-zh encoder for every Memory Realm"

[[inputs]]
name = "memory_env"
install_path = "/etc/eidolon/memory.env"
kind = "secret"
source = "operator"
owner = "root"
group = "root"
mode = "0600"
required_by = ["eidolon-memory-embedder", "eidolon-memory-supervisor", "eidolon-memory-discovery"]

[[inputs]]
name = "memory_settings"
install_path = "/etc/eidolon/memory.yaml"
kind = "settings"
source = "operator"
owner = "root"
group = "eidolon"
mode = "0640"
required_by = ["eidolon-memory-embedder", "eidolon-memory-supervisor", "eidolon-memory-discovery"]

[[artifacts]]
id = "bge-small-zh"
kind = "model"
install_root = "/var/lib/eidolon/models/bge-small-zh"
# The board's encoder is the same immutable BGE-small-zh-v1.5 identity Memory
# declares in settings: 512 dimensions, shared once across all Realm runners.
#
# Declared here because a release is exact git commits and these files are in
# neither. Without this, the first query on a fresh Host either downloads on
# demand or falls back to something slow, and the difference is not visible
# from anything a release reports.

[[artifacts.files]]
path = "onnx/model_quantized.onnx"
sha256 = "15b717c382bcb518ba457b93ea6850ede7f4f1cd8937454aa06972366cd19bcc"

[[artifacts.files]]
path = "tokenizer.json"
sha256 = "48cea5d44424912a6fd1ea647bf4fe50b55ab8b1e5879c3275f80e339e8fae26"

[[state.authority]]
path = "/var/lib/eidolon/memory"
owner = "eidolon"
group = "eidolon"
backup = "component-action"
snapshot_action = "POST /api/admin/realms/{memory_realm_id}/snapshot"
restore_action = "POST /api/admin/realms/{memory_realm_id}/restore"
# This is everything an Eidolon remembers, and it was the least acceptable gap
# in the backup. It is carried now, but not by an operator tool copying files:
# a space is MemPalace's palace directory, our sibling ledgers directory, and
# the embedder identity the vectors were produced under. Chroma persists that
# identity on the collection and refuses to open it under another encoder, so
# a copy that did not record it could only be restored by guessing.
#
# So the supervisor produces the copy — it owns realm lifecycle and knows where
# palaces live — and writes a manifest naming every file, its digest, and that
# identity. Ops names the destination, collects the directory and checks the
# manifest against it.
#
# The two actions are not symmetric. A snapshot needs no downtime: every file
# is SQLite and VACUUM INTO copies a live database consistently. A restore
# cannot happen under a live runner at all — one process holds a palace — so
# the supervisor takes that realm's runner off it, which is why putting a copy
# back is an action here rather than a file the operator tool writes.

[state]
runtime = ["/run/eidolon/memory"]

[reset]
factory = [
  "/var/lib/eidolon/memory",
  # The weights go too, and that is fine: they are not anyone's data, and the
  # next install carries them back — the Host is asked for the digest it
  # recorded, so a removed model reads as absent rather than as held. Declared
  # rather than left unclaimed, because a reset report where this appears with
  # nobody's name on it reads like something was overlooked.
  "/var/lib/eidolon/models",
]
