# Memory settings template for a deployment spanning hosts.
#
# Same structure as settings.example.yaml. Only values differ: vectors move to a
# Milvus server, the knowledge graph moves to Postgres, and the HTTP surfaces
# bind beyond loopback. No code path is conditional on this file — the service
# reads the same settings model either way.
#
# Why the graph has to move: a palace directory is otherwise self-contained, and
# vectors can already live on a server. The graph is the one part that must not
# stay on local disk when more than one host serves the same space, because the
# file cannot be shared safely.
#
# Secrets stay in config/.env, named by the _env fields below:
#   EIDOLON_MEMORY_MILVUS_TOKEN
#   EIDOLON_MEMORY_KG_PG_DSN
#   EIDOLON_MEMORY_LLM_API_KEY
#   EIDOLON_MEMORY_MCP_TOKEN

runtime:
  palaces_root: ""
  process_tmp_root: ""
  log_dir: ""
  run_dir: ""

mempalace:
  backend: milvus
  # A Milvus server or Zilliz Cloud endpoint.
  milvus_uri: http://milvus.internal:19530
  milvus_token_env: EIDOLON_MEMORY_MILVUS_TOKEN
  # Required whenever milvus_uri is set. Confines every collection this
  # deployment creates to a named database, so it cannot mix its data into
  # whatever else lives on the instance. Config load fails without it.
  milvus_db_name: eidolon
  # Prefixes collection names, so several deployments can share one database.
  milvus_namespace: eidolon
  # Same embedder as the local profile, and deliberately so: a palace is bound to
  # the embedder it was built with, so differing here would make a space
  # unmovable between deployments.
  #
  # Note this cost lands on *this* process, not on Milvus. Milvus declares
  # requires_explicit_embeddings — we compute vectors locally with ONNX and send
  # them. It only runs the sparse/BM25 half server-side. So a heavier embedder
  # buys nothing from having a vector server, and does pay in the resident model
  # per worker, which is what limits how many spaces one host can serve.
  embedding_model: embeddinggemma
  embedding_device: cpu
  # Point at a pre-staged copy so a worker does not pull ~300MB from HuggingFace
  # on first use. On a fleet this matters more than locally.
  embedding_model_dir: ""
  embedding_threads: 0

kg:
  # The graph is the one part of a palace that cannot stay on local disk here: a
  # replica keeping it in a file would be per-replica state, and replicas have to
  # be interchangeable. Needs the 'postgres' extra installed.
  backend: postgres
  postgres_dsn_env: EIDOLON_MEMORY_KG_PG_DSN
  min_confidence_to_write: 0.6

ledgers:
  # Must be postgres here. Left as "palace" the files would be per-replica, so a
  # fact one replica invalidated would still be recalled by another. The router
  # logs a warning and serves without them rather than refusing to start, which
  # means a wrong value here degrades quietly — check the startup log.
  #
  # Three of the six are implemented on PostgreSQL so far: extraction decisions,
  # device sync, dead letters. Until commitments, canonical facts and command
  # status follow, a shared-storage deployment answers commitment queries empty
  # and does not invalidate corrected facts.
  backend: postgres
  postgres_dsn_env: EIDOLON_MEMORY_LEDGER_PG_DSN

registry:
  source: eidolon-admin
  static_path: ""

nats:
  url: nats://nats.internal:4222

command_status:
  retention_days: 30
  max_records: 100000
  prune_every_writes: 100

llm:
  model: openai/deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  api_key_env: EIDOLON_MEMORY_LLM_API_KEY
  temperature: 0.0

mcp_http:
  host: 0.0.0.0
  port: 10030
  stateless_http: true
  json_response: true
  bearer_token_env: EIDOLON_MEMORY_MCP_TOKEN

discovery_http:
  host: 0.0.0.0
  port: 8020

steward:
  mode: llm

recall:
  top_k: 5
  livekit_timeout_seconds: 0.3
  # A remote vector store adds a network round trip that a local file does not.
  # Keep the voice budget but expect less headroom inside it.

supervisor:
  admin_api_url: http://admin.internal:9000
