runtime:
  palaces_root: ~/eidolon/memory/mempalaces
  log_dir: ''
  run_dir: ''
mempalace:
  backend: chroma
embedding:
  # See settings.example.yaml for the measured comparison and for what `provider`
  # can be. Unchanged from when these four keys lived under `mempalace:` —
  # bge-small-zh on CPU, in process. Palaces built with a different embedder
  # cannot be opened under this one — Chroma persists the embedder on the
  # collection — so switching means deleting palaces_root.
  provider: local
  model: bge-small-zh
  device: cpu
  # Empty: bge downloads through the normal HF cache. The directory that used to
  # be here holds embeddinggemma's files, which this model does not read.
  model_dir: ''
nats:
  url: nats://127.0.0.1:4222
llm:
  model: openai/deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  api_key_env: EIDOLON_MEMORY_LLM_API_KEY
  # Measured 2026-08-03 against this endpoint: a trivial call returns in 2.4s,
  # the real steward prompt (8.3k chars) takes 22.9s. At 30 the headroom was 7s,
  # so ordinary variance tripped the timeout and litellm's retries turned one
  # slow turn into ~93s of wall clock. The model is not slow; the prompt is large.
  timeout_seconds: 90
  temperature: 0.0
mcp_http:
  host: 127.0.0.1
  port: 10030
  stateless_http: true
  json_response: true
  bearer_token_env: EIDOLON_MEMORY_MCP_TOKEN
discovery_http:
  host: 127.0.0.1
  port: 8020
steward:
  mode: llm
recall:
  top_k: 5
  livekit_timeout_seconds: 0.3
supervisor:
  admin_api_url: http://127.0.0.1:9000
