runtime:
  palaces_root: $EIDOLON_STATE_ROOT/memory/mempalaces
  log_dir: ''
  run_dir: ''
mempalace:
  backend: chroma
embedding:
  # See settings.example.yaml for the measured comparison and for what `provider`
  # can be. Palaces built with a different embedder cannot be opened under this
  # one — Chroma persists the embedder on the collection — so switching means
  # deleting palaces_root.
  #
  # This machine runs bge-large-zh; the Pi runs bge-base-zh. Measured on a Pi 5
  # over 1000 C-MTEB VideoRetrieval queries (benchmarks/results/bge-base-pi5):
  # large scores MRR 0.813 against base's 0.787, for 626 MB on disk against 198
  # and 104 ms/doc against 32. A laptop can pay that and the board cannot, which
  # is the whole reason the two differ.
  provider: local
  model: bge-large-zh
  device: cpu
  # Empty: bge downloads through the normal HF cache. The directory that used to
  # be here holds embeddinggemma's files, which this model does not read.
  model_dir: ''
nats:
  url: nats://127.0.0.1:4222
llm:
  model: openai/deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  api_key_env: EIDOLON_MEMORY_LLM_API_KEY
  # Measured 2026-08-03 against this endpoint: a trivial call returns in 2.4s,
  # the real steward prompt (8.3k chars) takes 22.9s. At 30 the headroom was 7s,
  # so ordinary variance tripped the timeout and litellm's retries turned one
  # slow turn into ~93s of wall clock. The model is not slow; the prompt is large.
  timeout_seconds: 90
  temperature: 0.0
mcp_http:
  host: 127.0.0.1
  port: 10030
  stateless_http: true
  json_response: true
  bearer_token_env: EIDOLON_MEMORY_MCP_TOKEN
discovery_http:
  host: 127.0.0.1
  port: 8020
steward:
  mode: llm
recall:
  top_k: 5
  livekit_timeout_seconds: 0.3
supervisor:
  admin_api_url: http://127.0.0.1:9000
