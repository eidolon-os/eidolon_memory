runtime:
  palaces_root: $EIDOLON_STATE_ROOT/memory/mempalaces
  log_dir: ''
  run_dir: ''
mempalace:
  backend: chroma
embedding:
  # See settings.example.yaml for the measured comparison and for what `provider`
  # can be. Palaces built with a different embedder cannot be opened under this
  # one — Chroma persists the embedder on the collection — so switching means
  # deleting palaces_root.
  #
  # MemPalace 3.8 exposes an OpenAI-compatible provider and explicit vector APIs.
  # All Memory processes use the existing single embedding service; no process
  # injects Eidolon providers into MemPalace internals or loads another copy of
  # the model. BGE-small-zh uses no query/document prefix in this deployment.
  provider: http
  model: bge-small-zh
  http:
    base_url: http://127.0.0.1:8760/v1
    model: bge-small-zh
    dimension: 512
    collection_name: bge_small_zh_v15
nats:
  url: nats://127.0.0.1:4222
llm:
  model: openai/deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  api_key_env: EIDOLON_MEMORY_LLM_API_KEY
  # Measured 2026-08-03 against this endpoint: a trivial call returns in 2.4s,
  # the real steward prompt (8.3k chars) takes 22.9s. At 30 the headroom was 7s,
  # so ordinary variance tripped the timeout and litellm's retries turned one
  # slow turn into ~93s of wall clock. The model is not slow; the prompt is large.
  timeout_seconds: 90
  temperature: 0.0
mcp_http:
  host: 127.0.0.1
  port: 10030
  stateless_http: true
  json_response: true
  bearer_token_env: EIDOLON_MEMORY_MCP_TOKEN
discovery_http:
  host: 127.0.0.1
  port: 8020
steward:
  mode: llm
recall:
  top_k: 5
  livekit_timeout_seconds: 0.3
registry:
  source: system-data
  system_data_url: http://127.0.0.1:8084
  system_data_token_env: EIDOLON_DATA_MEMORY_RUNTIME_ROSTER_TOKEN
  request_timeout_seconds: 5.0
