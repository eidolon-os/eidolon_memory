# Memory settings template — copy to config/settings.yaml
# Secrets: set llm.api_key_env / mcp_http.bearer_token_env names; values in config/.env

runtime:
  palaces_root: ""
  # Optional root for per-Realm SQLite/Chroma temp directories. Empty uses
  # <palaces_root>/.process-tmp. Env: EIDOLON_MEMORY_PROCESS_TMP_ROOT.
  process_tmp_root: ""
  log_dir: ""
  run_dir: ""

mempalace:
  # chroma is the default embedded local backend. Use qdrant for A/B testing
  # with a local Qdrant service listening on qdrant_url.
  backend: chroma
  # Optional: minilm (legacy/English) or embeddinggemma (multilingual).
  # Existing palaces must be rebuilt before switching embedding_model.
  embedding_model: ""
  # Optional: auto, cpu, cuda, coreml, or dml.
  embedding_device: ""
  # Optional local copy of model files for operations/runbooks.
  embedding_model_dir: ""
  # MemPalace 3.5+: explicit ONNX Runtime intra-op cap. 0 keeps the native
  # auto default; set a positive value after cross-Realm CPU/latency testing.
  embedding_threads: 0
  qdrant_url: http://127.0.0.1:6333
  qdrant_namespace: eidolon-dev
  qdrant_timeout_seconds: 10
  qdrant_api_key_env: MEMPALACE_QDRANT_API_KEY

nats:
  url: nats://127.0.0.1:4222

# Command outcomes are an operational projection, not permanent user memory.
# Keep the table bounded even when a Realm runs for years.
command_status:
  retention_days: 30
  max_records: 100000
  prune_every_writes: 100

llm:
  model: openai/deepseek-v4-flash
  base_url: http://127.0.0.1:8180/v1
  api_key_env: EIDOLON_MEMORY_LLM_API_KEY

mcp_http:
  host: 127.0.0.1
  port: 10030
  stateless_http: true
  json_response: true
  bearer_token_env: EIDOLON_MEMORY_MCP_TOKEN

discovery_http:
  host: 127.0.0.1
  port: 8020

steward:
  mode: llm

recall:
  top_k: 5
  livekit_timeout_seconds: 0.3

supervisor:
  admin_api_url: http://127.0.0.1:9000
