# Memory settings template — copy to config/settings.yaml
#
# Everything on one machine: vectors, graph and ledgers in files inside each
# palace directory, one owning process per palace.
#
# Secrets are never written here. A field ending in _env names the environment
# variable holding the value; put those in config/.env.

runtime:
  # Empty uses $EIDOLON_STATE_ROOT/memory/mempalaces-v3.8. This epoch boundary
  # deliberately leaves pre-3.8 Palace data untouched.
  palaces_root: ""
  # Optional root for per-Realm SQLite/Chroma temp directories. Empty uses
  # <palaces_root>/.process-tmp. Env: EIDOLON_MEMORY_PROCESS_TMP_ROOT.
  process_tmp_root: ""
  log_dir: ""
  run_dir: ""

mempalace:
  # chroma keeps vectors in a file in the palace directory.
  backend: chroma
  # The embedder is configured in the `embedding` section below. MemPalace 3.8
  # receives explicit vectors through its public API. The four old keys
  # (embedding_model, embedding_device, embedding_model_dir, embedding_threads)
  # are still accepted for compatibility and folded into that section at load;
  # setting the same thing in both places is refused when the two disagree.

embedding:
  # Which implementation runs. This one line is the whole switch:
  #
  #   auto        read it off `model`: ours if we implement that name (the nine in
  #               LOCAL_EMBEDDING_MODELS), MemPalace's if they do (minilm,
  #               embeddinggemma). The default.
  #   local       an in-process quantized ONNX session. ~130MB for the default
  #               model, no network, sub-millisecond.
  #   http        a hosted OpenAI-compatible /v1/embeddings endpoint. Never
  #               inferred — a model name cannot imply a network address — so it
  #               has to be written here. See the `http:` block below.
  #   mempalace   one of MemPalace's own two.
  #
  # Changing the effective encoder means rebuilding the palace. Chroma persists
  # the embedder's name on the collection and refuses mismatched reads, so the
  # switch fails loudly rather than silently comparing vectors from two different
  # vector spaces. That refusal is the mechanism, not a defect.
  provider: http

  # Production default: bge-small-zh on the Pi and on every writer/reader of the
  # same fresh Palace. Model identity, 512 dimensions and the query/document
  # contract are one storage invariant; changing any of them creates a new
  # vector space.
  #
  # Measured on a Raspberry Pi 5 over C-MTEB VideoRetrieval — 1000 queries
  # against a 20 000-document corpus, full runs, batch 32
  # (benchmarks/results/bge-base-pi5):
  #
  #   model            dim    R@1     MRR@10   on disk   ms/doc (Pi 5)
  #   bge-small-zh     512   67.2%    0.753      47MB       6.5   ← the Pi
  #   bge-base-zh      768   70.9%    0.787     198MB      32.5
  #   bge-large-zh    1024   73.9%    0.813     626MB     104.1
  #
  # An earlier version of this comment carried a 43-query table and concluded the
  # three sizes could not be told apart, so the cheapest should win. **At 1000
  # queries they can.** The ordering is monotone in size and both gaps (0.034 and
  # 0.026 MRR) sit far outside the 0.0077 MRR that batch size alone moves this
  # metric — the noise floor, measured rather than assumed. The 43-query reading
  # was a sample-size limit being reported as a tie.
  #
  # What did not change is that quality is not free. bge-large costs 3.2x the
  # latency of base per document on this board, which a laptop can absorb and a
  # four-core Pi sharing itself with Chroma, NATS and the steward cannot.
  #
  # Two further findings from the same runs, both about this family:
  #
  #   * BGE's optional Chinese retrieval instruction on the query side **lowers**
  #     the score — 0.9415 to 0.9332 MRR over 200 queries — so no prefix is
  #     configured for it, deliberately.
  #   * bge-*-zh is Chinese-only. On English dialogue (LoCoMo, 1977 annotated
  #     questions) the whole family scores 0.211 to 0.247 MRR and scaling does not
  #     help: 24M to 326M parameters moves R@1 only between 14.2% and 16.7%. If a
  #     palace holds much English, no size of this model is the right choice.
  #
  # The Pi selects small despite base's higher retrieval score because base costs
  # 5x the measured document latency and about 4x the model disk footprint. The
  # Agent latency and board-wide RSS acceptance tests decide that trade-off; it
  # is not inferred from model size alone.
  #
  # bge-m3 is implemented and rejected for this board on memory: 2.79 GB resident
  # at batch 8 and 6.7 GB at batch 16 on 8 GB with no swap, and second-worst of
  # eight models on Chinese dialogue anyway.
  #
  # An unrecognised name is refused at config load, because MemPalace answers
  # anything it does not know with minilm and says nothing.
  model: bge-small-zh
  # ONNX Runtime execution provider for `local`: auto, cpu, cuda, coreml, or dml.
  device: ""
  # Optional local copy of the model files, so a deployment can ship them instead
  # of probing the hub on first use. Our own encoder reads this directory
  # directly when developing the standalone embedding service.
  model_dir: ""
  # Explicit ONNX Runtime intra-op cap. 0 keeps the native auto default (≈ core
  # count), which a background mine will happily use all of.
  threads: 0

  # Read only when provider is http. Two different deployments use this, and the
  # second is the one that matters on a board:
  #
  # 1. A hosted endpoint. The one way to run the model that retrieves best of
  #    everything measured on hardware that cannot hold it — embeddinggemma needs
  #    3GB on a 4GB Pi — at the cost of a network hop inside the recall path.
  #
  # 2. `eidolon-memory-embedder` on this same machine, over loopback. The
  #    supervisor spawns one agent_runner per user, and on the Pi 5 each one is
  #    244.4 MB resident of which 156.4 MB is the ONNX session — the same weights,
  #    once per user. Pointing them at one local server measured 88 MB each, so
  #    ten users go from 2.44 GB to 1.12 GB. It also collapses N sessions each
  #    running `threads` threads on four cores down to one.
  #
  # Nothing is stored off this machine by either. The endpoint sees the text of a
  # query or a fragment and answers with a vector; the palace stays local. This
  # is not the cloud storage that was deliberately removed from this project.
  #
  # For deployment 2 on this board:
  #
  #   eidolon-memory-embedder --model bge-small-zh --model-dir /opt/eidolon/models/bge-small-zh
  #
  #   embedding:
  #     provider: http
  #     http:
  #       base_url: http://127.0.0.1:8760/v1
  #       model: bge-small-zh
  #       dimension: 512
  #       collection_name: bge_small_zh_v15
  #
  # That last line is not optional and not cosmetic. A hosted endpoint's name is
  # prefixed (`http_bge_small_zh`) precisely so a palace built by one
  # implementation cannot be read by another claiming the same model id — a
  # hosted "bge-small-zh" is nobody's promise of the same weights. This release
  # creates a fresh Palace with the explicit local identity above; it does not
  # reinterpret or migrate vectors from an older Palace. Chroma refusing an
  # identity mismatch is the guard working, not a bug.
  http:
    # The API root, ending in /v1. `/embeddings` is appended.
    base_url: http://127.0.0.1:8760/v1
    # The model id the endpoint accepts. Defaults to `model` above when blank.
    model: bge-small-zh
    # Name of the env var holding the key; put the value in config/.env. Blank
    # means the endpoint needs no credential. A named variable that resolves
    # empty is an error, not an empty Bearer header answered with a 401.
    api_key_env: ""
    # The width the endpoint returns. Required, and not discoverable: it fixes
    # the collection's width at creation, and a palace build that first has to
    # ask a network service is a build that fails differently on a bad day.
    # Checked against every response, so a wrong value is reported here rather
    # than surfacing later as a rejected write.
    dimension: 512
    # Persisted by Chroma on the collection. Derived from the model id when
    # blank (as http_<model>), which is enough to keep two hosted models apart.
    collection_name: bge_small_zh_v15
    # As mandatory for a hosted E5 as for a local one, and as silent when
    # omitted: not an error, just worse ranking.
    query_prefix: ""
    document_prefix: ""
    # A ceiling for a failing call, not a target — this sits inside the recall
    # path, whose end-to-end p95 is 20ms on the local embedder.
    timeout_seconds: 30.0
    batch_size: 32
    # Retries cover a transport error, a 429 or a 5xx. A 4xx is not retried: a
    # wrong model id or a rejected key will be just as wrong the second time.
    max_retries: 2

kg:
  # sqlite keeps the graph in the palace directory. Set "none" to run on vector
  # recall alone — the service starts, graph tools are not offered, and nothing
  # already stored is deleted.
  backend: sqlite
  min_confidence_to_write: 0.6

ledgers:
  # The append-only records beside the memories: extraction decisions, canonical
  # facts, commitments, command status, dead letters, device sync. Two of them are
  # product behaviour rather than bookkeeping — canonical facts hold the chain
  # that stops a corrected fact being recalled, and commitments are what
  # commitment queries are answered from.
  #
  # SQLite files next to the memories. Its own section rather than part of kg on
  # purpose: the graph can be turned off at runtime, and reading the ledgers'
  # location out of an optional section would mean turning the graph off took
  # commitments and the invalidation chain with it.
  backend: palace

registry:
  # Which memory spaces to serve. system-data consumes the authenticated,
  # versioned System Data runtime roster; static is standalone-only.
  source: system-data
  system_data_url: http://127.0.0.1:8084
  system_data_token_env: EIDOLON_DATA_MEMORY_RUNTIME_ROSTER_TOKEN
  request_timeout_seconds: 5.0
  static_path: ""

nats:
  url: nats://127.0.0.1:4222

# Command outcomes are an operational projection, not permanent user memory.
# Keep the table bounded even when a Realm runs for years.
command_status:
  retention_days: 30
  max_records: 100000
  prune_every_writes: 100

llm:
  model: openai/deepseek-v4-flash
  base_url: http://127.0.0.1:8180/v1
  api_key_env: EIDOLON_MEMORY_LLM_API_KEY
  # The steward prompt is large, so extraction is slow even on a fast model:
  # measured 22.9s per turn against a hosted endpoint whose trivial calls take
  # 2.4s. Too tight a value does not fail fast, it retries — turning one slow
  # turn into three timeouts. Extraction is off the reply path, so err high.
  timeout_seconds: 90
  temperature: 0.0

mcp_http:
  host: 127.0.0.1
  port: 10030
  stateless_http: true
  json_response: true
  bearer_token_env: EIDOLON_MEMORY_MCP_TOKEN

discovery_http:
  host: 127.0.0.1
  port: 8020

steward:
  mode: llm

recall:
  top_k: 5
  livekit_timeout_seconds: 0.3

supervisor:
  eager_init: true
