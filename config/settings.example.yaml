# Memory settings template — copy to config/settings.yaml
#
# This is the local shape: everything on one machine, vectors and graph in files
# inside each palace directory. For the deployment that spans hosts, see
# settings.cloud.example.yaml — the two files have the same structure and differ
# only in values, so moving between them is a config change and nothing else.
#
# Secrets are never written here. A field ending in _env names the environment
# variable holding the value; put those in config/.env.

runtime:
  palaces_root: ""
  # Optional root for per-Realm SQLite/Chroma temp directories. Empty uses
  # <palaces_root>/.process-tmp. Env: EIDOLON_MEMORY_PROCESS_TMP_ROOT.
  process_tmp_root: ""
  log_dir: ""
  run_dir: ""

mempalace:
  # chroma keeps vectors in a file in the palace directory. The alternative is
  # milvus, for deployments serving spaces from more than one host.
  backend: chroma
  # minilm (English only, cross-lingual cosine ~0.35) or embeddinggemma
  # (100+ languages, ~0.88). Both produce 384-dim vectors — embeddinggemma
  # reaches that by Matryoshka truncation — so this choice is about retrieval
  # quality, not vector size or storage cost.
  #
  # Set it explicitly. Leaving it empty means we pass no model to MemPalace,
  # which then applies its own default of minilm — so a NEW palace silently gets
  # the English-only embedder. An existing palace keeps whatever it was built
  # with regardless, and MemPalace refuses to open one whose embedder no longer
  # matches; changing this means rebuilding the index.
  embedding_model: embeddinggemma
  # Optional: auto, cpu, cuda, coreml, or dml.
  embedding_device: ""
  # Optional local copy of model files for operations/runbooks.
  embedding_model_dir: ""
  # MemPalace 3.5+: explicit ONNX Runtime intra-op cap. 0 keeps the native
  # auto default; set a positive value after cross-Realm CPU/latency testing.
  embedding_threads: 0
  # Unused while backend is chroma. Listed so switching to milvus is a matter of
  # filling these in rather than discovering they exist. milvus_db_name becomes
  # mandatory as soon as milvus_uri is set.
  milvus_uri: ""
  milvus_token_env: EIDOLON_MEMORY_MILVUS_TOKEN
  milvus_db_name: ""
  milvus_namespace: eidolon

kg:
  # sqlite keeps the graph in the palace directory. Set "none" to run on vector
  # recall alone — the service starts, graph tools are not offered, and nothing
  # already stored is deleted. "postgres" is for the multi-host shape.
  backend: sqlite
  # Read only when backend is postgres.
  postgres_dsn_env: EIDOLON_MEMORY_KG_PG_DSN
  min_confidence_to_write: 0.6

ledgers:
  # The append-only records beside the memories: extraction decisions, canonical
  # facts, commitments, command status, dead letters, device sync. Two of them are
  # product behaviour rather than bookkeeping — canonical facts hold the chain
  # that stops a corrected fact being recalled, and commitments are what
  # commitment queries are answered from.
  #
  # "palace" keeps them as SQLite files next to the memories, which needs one
  # owning process. Separate from the kg setting on purpose: the graph is optional
  # at runtime, and reading these out of an optional section would mean turning
  # the graph off took the ledgers with it.
  backend: palace
  # Read only when backend is postgres.
  postgres_dsn_env: EIDOLON_MEMORY_LEDGER_PG_DSN

registry:
  # Which memory spaces to serve. eidolon-admin asks an Eidolon OS admin service;
  # static reads a roster file, which is what a standalone deployment uses.
  source: eidolon-admin
  static_path: ""

nats:
  url: nats://127.0.0.1:4222

# Command outcomes are an operational projection, not permanent user memory.
# Keep the table bounded even when a Realm runs for years.
command_status:
  retention_days: 30
  max_records: 100000
  prune_every_writes: 100

llm:
  model: openai/deepseek-v4-flash
  base_url: http://127.0.0.1:8180/v1
  api_key_env: EIDOLON_MEMORY_LLM_API_KEY
  temperature: 0.0

mcp_http:
  host: 127.0.0.1
  port: 10030
  stateless_http: true
  json_response: true
  bearer_token_env: EIDOLON_MEMORY_MCP_TOKEN

discovery_http:
  host: 127.0.0.1
  port: 8020

steward:
  mode: llm

recall:
  top_k: 5
  livekit_timeout_seconds: 0.3

supervisor:
  admin_api_url: http://127.0.0.1:9000
